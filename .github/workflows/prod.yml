name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_DIR: /var/www/CloudeasyDevops
      GIT_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

    steps:
      - name: Run deploy.sh on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: APP_DIR,GIT_BRANCH
          script: |
            set -euo pipefail
            export APP_DIR="${APP_DIR:-/var/www/CloudeasyDevops}"
            export GIT_BRANCH="${GIT_BRANCH:-main}"
            DEPLOY_SCRIPT="$APP_DIR/deploy.sh"

            if [ ! -f "$DEPLOY_SCRIPT" ] && [ -d "$APP_DIR/.git" ]; then
              echo ">>> Bootstrap: fetch deploy.sh from origin/$GIT_BRANCH"
              cd "$APP_DIR"
              git fetch origin "$GIT_BRANCH"
              git checkout "$GIT_BRANCH"
              git reset --hard "origin/$GIT_BRANCH"
            fi

            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              echo "Missing $DEPLOY_SCRIPT — clone the repo at $APP_DIR first."
              exit 1
            fi

            chmod +x "$DEPLOY_SCRIPT"
            exec bash "$DEPLOY_SCRIPT"
