# Default platform shell at https://terminal.cloudeasy.site (nginx → 127.0.0.1:3000)
# Copy .env.example → .env on the server, then: docker compose up -d

services:
  ttyd:
    image: tsl0922/ttyd:latest
    container_name: cloudeasy-ttyd
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command:
      - ttyd
      - --writable
      - -p
      - "${TTYD_PORT:-3000}"
      - -c
      - "${TTYD_CREDENTIALS:-admin:changeme}"
      - bash
